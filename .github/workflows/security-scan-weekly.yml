name: Weekly Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Generate report
      if: always()
      run: |
        date=$(date +%Y_%m_%d)
        echo "# QASP LTS Security Scan Report - $date" > reports/lts_security_$date.md
        echo "" >> reports/lts_security_$date.md
        echo "Generated by Trivy Action on $(date)" >> reports/lts_security_$date.md
        echo "" >> reports/lts_security_$date.md
        echo "## Summary" >> reports/lts_security_$date.md
        echo "- Total vulnerabilities found: " >> reports/lts_security_$date.md
        echo "- Critical: " >> reports/lts_security_$date.md
        echo "- High: " >> reports/lts_security_$date.md
        echo "- Medium: " >> reports/lts_security_$date.md
        echo "" >> reports/lts_security_$date.md
        echo "## Details" >> reports/lts_security_$date.md
        echo "See SARIF file for full details." >> reports/lts_security_$date.md

    - name: Commit report if repository allows
      if: github.ref == 'refs/heads/lts/v1'
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        date=$(date +%Y_%m_%d)
        git add reports/lts_security_$date.md
        git commit -m "Add weekly security scan report $date" || echo "Nothing to commit"

    - name: Run Dependabot updates (notification)
      run: echo "Dependabot alerts monitored via GitHub Security tab. Ensure auto-merge for security updates."
