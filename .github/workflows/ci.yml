name: CI
on:
  push:
    branches: [ main, vibe/dev/initial-implementation, vibe/dev/qasp-v1.0-stable ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly audit on main branch
    - cron: '0 0 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Run lint
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  pqc-compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make libssl-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PQC smoke test
        run: |
          python -c "
          import oqs
          print('Testing Kyber512...')
          kem = oqs.KeyEncapsulation('Kyber512')
          pub = kem.generate_keypair()
          ciphertext, secret = kem.encap_secret(pub)
          dec_secret = kem.decap_secret(ciphertext)
          assert secret == dec_secret
          print('Kyber512 KEM test passed')

          print('Testing Dilithium3...')
          sig = oqs.Signature('Dilithium3')
          pk, sk = sig.generate_keypair()
          msg = b'Hello PQC'
          signature = sig.sign(msg)
          assert sig.verify(msg, signature, pk)
          print('Dilithium3 signature test passed')

          print('PQC compatibility check succeeded')
          "

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Security scan stub
        run: echo "Security scan placeholder - integrate Snyk, Dependabot, or other tools"

  audit-crypto-params:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make libssl-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run cryptographic parameters audit
        run: python tools/audit_crypto_params.py > crypto_audit_report.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: crypto-audit-report
          path: crypto_audit_report.txt

  external-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make libssl-dev
      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml
      - name: Run external compliance audit
        env:
          HSM_ENABLED: true
          QKD_HARDWARE_ENABLED: true
          QKD_MODE: simulated
        run: python audit_pipeline/generate_audit_report.py
      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: external-audit-report
          path: audit_pipeline/reports/audit_report_v1_0.json

  stress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make libssl-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start QASP server
        run: |
          python src/server/main.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
      - name: Run stress performance test
        env:
          HSM_ENABLED: true
          QKD_HARDWARE_ENABLED: false
        run: python tools/perf_stress_qasp.py --clients 100 --max-concurrent 50 --output-dir reports
      - name: Stop QASP server
        run: |
          kill $SERVER_PID || true
      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-report
          path: reports/perf_v1_0_stable.json
      - name: Upload Grafana export
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-grafana
          path: reports/grafana_perf_export.json
