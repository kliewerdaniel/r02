name: CI
on:
  push:
    branches: [ main, vibe/dev/initial-implementation ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Run lint
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  pqc-compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make libssl-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PQC smoke test
        run: |
          python -c "
          import oqs
          print('Testing Kyber512...')
          kem = oqs.KeyEncapsulation('Kyber512')
          pub = kem.generate_keypair()
          ciphertext, secret = kem.encap_secret(pub)
          dec_secret = kem.decap_secret(ciphertext)
          assert secret == dec_secret
          print('Kyber512 KEM test passed')

          print('Testing Dilithium3...')
          sig = oqs.Signature('Dilithium3')
          pk, sk = sig.generate_keypair()
          msg = b'Hello PQC'
          signature = sig.sign(msg)
          assert sig.verify(msg, signature, pk)
          print('Dilithium3 signature test passed')

          print('PQC compatibility check succeeded')
          "

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Security scan stub
        run: echo "Security scan placeholder - integrate Snyk, Dependabot, or other tools"
