name: Weekly LTS Metrics Report

on:
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Generate LTS usage summary
      run: |
        python -c "
        from src.analytics.metrics_collector import LTSMetricsCollector
        collector = LTSMetricsCollector()
        collector.export_summary()
        "

    - name: Add and commit report
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add reports/lts_usage_summary.json
        git commit -m "Add weekly LTS usage summary report" || echo "No changes to commit"
